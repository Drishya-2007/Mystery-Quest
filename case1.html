<script type="text/babel">
const { useState } = React;

const CLUE_DATA = [
  {
    title:"THE FIRST NOTE",
    story:"A rain-soaked alley behind the Jade Lotus bar.",
    riddle:"I have cities, but no houses. Mountains, but no trees. Water, but no fish. What am I?",
    options:["A painting","A map","A dream","A mirror"],
    correctAnswer:"A map",
    feedback:"A map. A location is circled in red — the old clock tower."
  },
  {
    title:"THE CLOCK TOWER",
    story:"Dust covers everything except a trail of footprints.",
    riddle:"The more you take, the more you leave behind. What am I?",
    options:["Time","Footsteps","Memories","Breath"],
    correctAnswer:"Footsteps",
    feedback:"Footsteps. They lead to a hidden basement door."
  },
  {
    title:"THE BASEMENT",
    story:"A radio crackles beside scattered photographs.",
    riddle:"I speak without a mouth and hear without ears. What am I?",
    options:["A shadow","A ghost","An echo","A whisper"],
    correctAnswer:"An echo",
    feedback:"An echo. Something clicks behind you."
  },
  {
    title:"THE APARTMENT",
    story:"A flickering lamp. A journal lies open.",
    riddle:"I can be cracked, made, told, and played. What am I?",
    options:["Bones","A joke","Code","Rule"],
    correctAnswer:"A joke",
    feedback:"A joke. A confession hidden in humor."
  },
  {
    title:"THE FINAL NOTE",
    story:"Back at the bar, a note under untouched whiskey.",
    riddle:"What disappears as soon as you say its name?",
    options:["Darkness","Silence","A secret","Time"],
    correctAnswer:"Silence",
    feedback:"Silence. The truth was never meant to be loud."
  }
];

function getRank(score){
  if(score >= 100) return "🏆 Chief Detective";
  if(score >= 80) return "🕵️ Major Detective";
  if(score >= 60) return "🔍 Detective";
  if(score >= 20) return "📘 Junior Detective";
  return "🧢 Trainee";
}

function CaseFile() {
  const [index,setIndex] = useState(0);
  const [selected,setSelected] = useState(null);
  const [feedback,setFeedback] = useState("");
  const [score,setScore] = useState(0);
  const [locked,setLocked] = useState(false);
  const [showSummary,setShowSummary] = useState(false);
  const [showHome,setShowHome] = useState(false);

  const clue = CLUE_DATA[index];

  const choose = opt => {
    if(locked) return;
    setSelected(opt);
    setLocked(true);

    if(opt === clue.correctAnswer){
      setScore(s => s + 20);
      setFeedback(`✔ Evidence secured — ${clue.feedback}`);
    } else {
      setScore(s => Math.max(0, s - 10));
      setFeedback(`✖ Wrong evidence — ${clue.feedback}`);
    }
  };

  const next = () => {
    if(index === CLUE_DATA.length - 1){
     setShowSummary(true); 
      db.collection("scores").add({
    player: "Drishya.R",
    score: score,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  })
  .then(() => console.log("Score saved to Firebase"))
  .catch(err => console.error("Error:", err));

    } else {
      setIndex(i => i + 1);
      setSelected(null);
      setFeedback("");
      setLocked(false);
    }
  };

  const resetGame = () => {
    setIndex(0);
    setSelected(null);
    setFeedback("");
    setScore(0);
    setLocked(false);
    setShowSummary(false);
    setShowHome(false);
  };

  if(showHome){
    return (
      <div className="min-h-screen flex items-center justify-center text-center">
        <div className="neon-border p-10 rounded-xl">
          <h1 className="header-font text-3xl text-cyan-400 mb-6">SELECT CASE LEVEL</h1>
          <p className="text-slate-400 mb-6">(Coming soon)</p>
          <button onClick={resetGame}
            className="border px-6 py-2 hover:bg-white hover:text-black">
            BACK TO CASE
          </button>
        </div>
      </div>
    );
  }

  return (
    <>
    <div className="max-w-4xl mx-auto p-8">

      <div className="flex justify-between mb-6">
        <span className="text-xs text-slate-500">CLUE {index+1} / 5</span>
        <span className="header-font text-orange-500">{score} PTS</span>
      </div>

      <div className="flex gap-2 mb-10">
        {CLUE_DATA.map((_,i)=>(
          <div key={i} className={`progress-bar ${i<=index?'progress-active':''}`}></div>
        ))}
      </div>

      <h2 className="header-font text-2xl text-cyan-400 mb-2">{clue.title}</h2>
      <p className="text-slate-400 italic mb-6">{clue.story}</p>

      <div className="neon-border p-8 rounded mb-8 text-center italic text-xl">
        "{clue.riddle}"
      </div>

      <div className="space-y-4">
        {clue.options.map(opt=>(
          <button key={opt}
            onClick={()=>choose(opt)}
            className={`w-full p-4 border rounded text-left transition
              ${selected===opt
                ? opt===clue.correctAnswer
                  ? 'border-cyan-400 bg-cyan-950/30'
                  : 'border-red-500 bg-red-950/30'
                : 'border-slate-800 hover:border-slate-600'}`}>
            {opt}
          </button>
        ))}
      </div>

      {feedback && (
        <div className="mt-6 text-sm text-slate-300 italic">{feedback}</div>
      )}

      {locked && (
        <div className="mt-10 flex justify-end">
          <button onClick={next}
            className="header-font border border-cyan-400 px-8 py-2 text-cyan-400 hover:bg-cyan-400 hover:text-black">
            {index === 4 ? "CLOSE CASE" : "NEXT CLUE"}
          </button>
        </div>
      )}
    </div>

    {showSummary && (
      <div className="fixed inset-0 bg-black/80 backdrop-blur flex items-center justify-center p-6 z-50">
        <div className="neon-border bg-slate-950 p-10 max-w-md w-full text-center rounded-xl">
          <p className="text-xs tracking-widest text-slate-500 mb-2">CASE FILE #0047</p>
          <h2 className="header-font text-3xl text-cyan-400 mb-6">CASE CLOSED</h2>

          <p className="text-slate-400 italic mb-8 text-sm">
            "The silence told you everything. What was buried in whispers and riddles now rests in your case file.
            The neon district sleeps a little easier tonight."
          </p>

          <div className="mb-6">
            <div className="text-4xl header-font text-orange-500">{score}</div>
            <div className="text-xs uppercase text-slate-500">Evidence Points</div>
          </div>

          <div className="mb-6 text-xl">{getRank(score)}</div>

          <button onClick={resetGame}
            className="w-full border border-slate-500 py-3 header-font hover:bg-white hover:text-black mb-4">
            REOPEN CASE
          </button>

          <button onClick={()=> window.location.href = 'level.html'}
    className="w-full border border-cyan-400 py-3 header-font text-cyan-400 hover:bg-cyan-400 hover:text-black">
    HOME
</button>

        </div>
      </div>
    )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<CaseFile/>);
</script>
