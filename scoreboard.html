<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width-device-width", initial-scale="1.0">
<title>Detective Scoreboard</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">

<style>
  body { background:#020617; color:#e2e8f0; font-family:'Rajdhani',sans-serif; }
  .header-font { font-family:'Orbitron',sans-serif; }
  .score-card { border:1px solid #22d3ee; padding:12px; border-radius:8px; margin-bottom:8px; box-shadow:0 0 8px #22d3ee; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

function Scoreboard() {
  const [scores, setScores] = useState([]);

  useEffect(() => {
    fetch('http://localhost:5000/score')
      .then(res => res.json())
      .then(data => {
        // sort scores descending
        data.sort((a,b) => b.score - a.score);
        setScores(data);
      })
      .catch(err => console.error("Error fetching scores:", err));
  }, []);

  return (
    <div className="max-w-md mx-auto p-8">
      <h1 className="header-font text-3xl text-cyan-400 mb-6 text-center">Detective Scoreboard</h1>
      {scores.length === 0 && <p className="text-slate-400 text-center">No scores yet.</p>}
      {scores.map((s,i) => (
        <div key={i} className="score-card flex justify-between">
          <span>{i+1}. {s.name}</span>
          <span>{s.score} pts</span>
        </div>
      ))}
      <button onClick={()=>window.location.href='index.html'}
        className="w-full border border-cyan-400 py-3 mt-6 header-font text-cyan-400 hover:bg-cyan-400 hover:text-black">
        BACK TO GAME
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Scoreboard />);
</script>

</body>
</html>
