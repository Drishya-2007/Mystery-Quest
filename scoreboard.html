<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Quest - Leaderboard</title>
    <style>
        :root { --neon-gold: #f0c342; --neon-blue: #4facfe; --bg: #020617; }
        body { background: #020617; color: white; font-family: sans-serif; text-align: center; margin: 0; }
        
        .top-nav { position: absolute; top: 20px; right: 20px; display: flex; gap: 15px; z-index: 100; }
        .nav-link { color: var(--neon-blue); text-decoration: none; font-size: 0.8rem; text-transform: uppercase; font-weight: bold; cursor: pointer; background: none; border: none; }

        #nameModal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { border: 2px solid var(--neon-blue); padding: 30px; border-radius: 12px; background: #0f172a; width: 280px; box-shadow: 0 0 20px var(--neon-blue); }
        
        /* Fixed Spacing: Input no longer sticks to button */
        .modal-content input { 
            background: #1e293b; border: 1px solid var(--neon-blue); color: white; 
            padding: 12px; margin-bottom: 25px; width: 100%; text-align: center; box-sizing: border-box;
            border-radius: 5px;
        }

        .container { max-width: 600px; margin: 90px auto; padding: 20px; }
        .rank-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px; margin: 8px 0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .user-highlight { border: 2px solid var(--neon-blue) !important; background: rgba(79, 172, 254, 0.1); }
        
        .btn-main { background: var(--neon-gold); border: none; padding: 14px 28px; cursor: pointer; font-weight: bold; border-radius: 4px; text-decoration: none; color: black; display: inline-block; margin-bottom: 25px; text-transform: uppercase; }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="index.html" class="nav-link">Home</a>
        <button id="triggerName" class="nav-link">Change Name</button>
    </nav>

    <div id="nameModal">
        <div class="modal-content">
            <h2 style="color: var(--neon-gold); margin-top:0;">IDENTIFY YOURSELF</h2>
            <input type="text" id="aliasInput" placeholder="Enter Your Name...">
            <button class="btn-main" id="saveName" style="background: var(--neon-blue); width: 100%; margin:0;">CONFIRM</button>
        </div>
    </div>

    <div class="container">
        <h1 style="color: var(--neon-gold); letter-spacing: 2px;">DETECTIVE RANKINGS</h1>
        <a href="level.html" class="btn-main">SOLVE NEXT CASE</a>
        <div id="leaderboard">Connecting to HQ...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBaTarh1A0pww9sffihtB-BsWZMCG-xhUg",
            authDomain: "mystery-quest-c511a.firebaseapp.com",
            projectId: "mystery-quest-c511a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const modal = document.getElementById('nameModal');
        
        let alias = localStorage.getItem('detectiveAlias');

        // New User check
        if (!alias) { modal.style.display = 'flex'; } 
        else { startLiveUpdates(); }

        document.getElementById('triggerName').onclick = () => { modal.style.display = 'flex'; };

        document.getElementById('saveName').onclick = async () => {
            const name = document.getElementById('aliasInput').value.trim();
            if (name) {
                localStorage.setItem('detectiveAlias', name);
                alias = name;
                modal.style.display = 'none';
                // Creates entry so new user appears on list
                await setDoc(doc(db, "leaderboard", name), { name: name, score: 0, cases: 0 }, { merge: true });
                startLiveUpdates();
            }
        };

        function startLiveUpdates() {
            const q = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(10));
            onSnapshot(q, (snaps) => {
                const list = [];
                snaps.forEach(d => list.push(d.data()));
                
                const bots = [{name:"ShadowCipher", score:450, cases:4}, {name:"NeonWraith", score:350, cases:3}];
                let combined = [...list];
                bots.forEach(b => { if(!combined.find(p => p.name === b.name)) combined.push(b); });
                combined.sort((a,b) => b.score - a.score);

                document.getElementById('leaderboard').innerHTML = combined.map((p, i) => `
                    <div class="rank-card ${p.name === alias ? 'user-highlight' : ''}">
                        <div style="text-align:left">
                            <span>#${i+1} <b>${p.name}</b></span>
                            <div style="font-size:0.7rem; color:#888">Cases Solved: ${p.cases || 0}/5</div>
                        </div>
                        <div style="color:var(--neon-gold); font-weight:bold">${p.score || 0} PTS</div>
                    </div>
                `).join('');
            });
        }
    </script>
</body>
</html>
